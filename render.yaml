# Web on Render; database is external (Neon recommended — or any Postgres via DATABASE_URL).
# Do NOT provision Render Postgres here — stale dpg-* hosts cause ENOTFOUND at boot.
# No `databases:` / `fromDatabase` — paste Neon into DATABASE_URL in the Dashboard.

services:
  - type: web
    # Live: https://dhandho-2kdx.onrender.com (srv-d9fmf3gk1i2s73b4flgg).
    # `name` must match the existing Dashboard service for Blueprint sync.
    name: dhandho-2kdx
    # Launch: upgrade off free for production SLA (sleep on free).
    plan: free
    runtime: node
    # Do NOT run `npm test` here: tests must not hit the production DB (CI runs them).
    # --include=dev: NODE_ENV=production would otherwise omit build tools
    # (tailwindcss, etc.) even when vite plugins are in dependencies.
    buildCommand: npm ci --include=dev && npm run build:prod
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Paste Neon (or any Postgres) URI in Render Dashboard — not fromDatabase
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        # Do NOT use generateValue — it rotates the secret on every deploy, logging out all users.
        # Set once in the Render Dashboard → Environment and never change it without a migration plan.
        sync: false
      - key: NODE_ENV
        value: production
      # Skip git hooks install on Render (husky is a local-dev tool)
      - key: HUSKY
        value: "0"
      - key: PORT
        value: 3001
      - key: DATABASE_SSL
        value: "true"
      # Neon / managed PaaS TLS — Node often needs this; safe for Neon/Render/Supabase hosts only
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      # Set these in Render Dashboard → Environment (sync: false = not auto-filled):
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      # Same-origin browser + hosted web. Extend in Dashboard for Cap allowlists if needed.
      - key: ALLOWED_ORIGINS
        value: https://dhandho-2kdx.onrender.com
      - key: LOGTAIL_TOKEN
        sync: false
      - key: SECRETS_ENCRYPTION_KEY
        sync: false
      # Sentry error monitoring — paste DSN from your Sentry project (Settings → Client Keys).
      # Leave unset to disable; both server and client no-op without it.
      - key: SENTRY_DSN
        sync: false
      # Frontend Sentry DSN — same value as SENTRY_DSN (injected at build time via Vite).
      # Set in Render Dashboard → Environment.
      - key: VITE_SENTRY_DSN
        sync: false
      # WhatsApp payment reminder cron — call POST /api/vendor-finance/reminders-run
      # with x-cron-secret: <value> header. Leave unset to disable cron path entirely.
      - key: CRON_SECRET
        sync: false
      # Pool size: default is 10. analytics/overview + FORCE RLS can peak at 10 simultaneous
      # connections for a single user. Set to 20 to safely handle 2-3 concurrent dashboard loads.
      # Neon free tier supports 20 connections; upgrade plan before scaling further.
      - key: DATABASE_POOL_SIZE
        value: "20"
